services:
  - type: web
    name: bengal-remedies-ceo-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_MODE
        value: synthetic
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./data/pharma.db
      - key: LOG_LEVEL
        value: INFO
